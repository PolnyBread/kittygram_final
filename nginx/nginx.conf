server {
    listen 80;
    index index.html;

    # Проксирование API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование админки
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика Django и собранный фронтенд (из volume static)
    location /static/ {
        alias /static/;      # путь внутри контейнера gateway, куда смонтирован volume static
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Медиафайлы пользователей (из volume media)
    location /media/ {
        alias /media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Все остальные запросы — отдаём index.html из фронтенда (SPA)
    location / {
        root /static;        # предполагается, что index.html лежит прямо в /static
        try_files $uri $uri/ /index.html;
    }
}
