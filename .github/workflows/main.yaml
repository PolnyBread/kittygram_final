name: Main Kittygram workflow

on:
  push:
    branches:
      - main

jobs:
  # 1. Тестирование бэкенда (с PostgreSQL)
  backend_tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.0
          pip install -r ./backend/requirements.txt

      - name: Lint with ruff
        run: python -m ruff check backend/

      - name: Run Django tests
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          cd backend/
          python manage.py test

  # 2. Тестирование фронтенда
  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd frontend/
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend/
          npm run test

  # 3. Сборка и отправка образа бэкенда
  build_backend_and_push:
    name: Push backend image to DockerHub
    runs-on: ubuntu-latest
    needs: backend_tests   # ждём успешного тестирования бэкенда
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/
          push: true
          tags: polnybread/kittygram_backend:latest   # заменил username на ваш логин

  # 4. Сборка и отправка образа фронтенда
  build_frontend_and_push:
    name: Push frontend image to DockerHub
    runs-on: ubuntu-latest
    needs: frontend_tests   # ждём успешного тестирования фронтенда
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/
          push: true
          tags: polnybread/kittygram_frontend:latest

  # 5. Сборка и отправка образа gateway (nginx)
  build_gateway_and_push:
    name: Push gateway image to DockerHub
    runs-on: ubuntu-latest
    needs: backend_tests   # необязательно, но можно зависеть от тестов бэкенда (gateway не требует тестов)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx/
          push: true
          tags: polnybread/kittygram_gateway:latest

  # 6. Отправка уведомления в Telegram
  send_message:
    runs-on: ubuntu-latest
    needs:
      - build_backend_and_push
      - build_frontend_and_push
      - build_gateway_and_push
    steps:
      - name: Send success message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}        # в GitHub Secrets: ваш ID 1093627170
          token: ${{ secrets.TELEGRAM_TOKEN }}  # токен бота
          message: |
            Workflow Kittygram успешно выполнен!
            Образы:
            - polnybread/kittygram_backend:latest
            - polnybread/kittygram_frontend:latest
            - polnybread/kittygram_gateway:latest
            загружены на Docker Hub.